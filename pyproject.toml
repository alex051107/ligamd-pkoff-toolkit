[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligamd-pkoff-toolkit"
version = "0.1.0"
description = "Reproducible LiGaMD trajectory measurements and experimental-pKoff baseline utilities"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "alex051107"}
]
keywords = ["molecular dynamics", "LiGaMD", "HSP90", "pKoff", "trajectory analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "joblib==1.5.2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "rdkit>=2024.3",
  "scikit-learn==1.7.2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ligamd-pkoff = "ligamd_pkoff.cli:main"

[tool.setuptools]
packages = ["ligamd_pkoff", "ligamd_pkoff.resources", "scripts", "scripts.koff_ml"]

[tool.setuptools.package-data]
ligamd_pkoff = [
  "resources/contracts/*.json",
  "resources/models/experimental_n31_registry_v1/*.json",
  "resources/models/experimental_n31_registry_v1/*.tsv",
  "resources/models/experimental_n31_registry_v1/models/*.joblib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
